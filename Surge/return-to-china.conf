# Bottom: Overseas websites are directly connected by default
FINAL,DIRECT,dns-failed


[Host]
localhost = 127.0.0.1


[URL Rewrite]
# Ad removal and redirection rules can be added on demand. It is not recommended to turn on too many rules by default to avoid affecting domestic app login and payment.


[MITM]
# It is not recommended for ordinary users to turn on MITM, which is easy to affect banking, payment, government affairs and video apps.

# If you need rewriting or scripting functions, please configure the certificate manually.

Enable=false



