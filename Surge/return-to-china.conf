# The following is a set of "Return Configuration File" template suitable for Surge 5 iOS overseas users.

# Purpose: When accessing mainland China App, video, music, online banking, government affairs, games and other services overseas, it automatically goes to the "return to China node"; when accessing overseas websites, it is directly connected by default; mainland China websites, apps and streaming media give priority to returning to China as agents; advertising and privacy tracking are the basic blocking.

# Instructions for use:

# 1. Save the above content as a .conf file, for example: Surge5-Return-to-China.conf

# 2. Open Surge 5 iOS: Configuration -> Import from file

# 3. Modify the [Proxy] area: Replace the "Return Node - Shanghai / Guangzhou / Beijing" with your own mainland China or China optimized line node.

# 4. If your airport offers Surge subscription: You can paste the node directly into the [Proxy] area; Or use an external subscription policy group, but manual configuration is more stable. 

# Five. Recommended strategy: Return to China mode: select "Automatic Return to China"

# Chinese media: Choose the "return to China mode"

# Chinese Application: Choose "Return to China Mode"

# China Finance: Choose the "return mode"

# Apple Service: Suggest DIRECT

# Global Direct Connection: DIRECT is recommended

# 6. If some overseas websites are also returned to China as agents:

# Add the website separately to the top of the rule, for example:

# DOMAIN-SUFFIX,google.com,DIRECT

# DOMAIN-SUFFIX,youtube.com,DIRECT

# DOMAIN-SUFFIX,facebook.com,direct

# DOMAIN-SUFFIX,instagram.com,DIRECT

# DOMAIN-SUFFIX,X.com,DIRECT

# 7. If a Chinese app still prompts regional restrictions: Add the domain name of the App to the top of [Rule] and specify the "return mode", for example:

# DOMAIN-SUFFIX,example.cn, return home mode

# DOMAIN-KEYWORD,example, return to China mode

# 8. If the bank, Alipay and WeChat payment are abnormal: Try first: China Finance -> DIRECT

# Someone

# China Finance -> Return to China Model

# Different banks have different risk control. Some banks may trust overseas local IP more, and some banks trust Chinese IP more.

[General]
loglevel = notify
ipv6 = true
show-error-page-for-reject = true
test-timeout = 5
internet-test-url = http://www.apple.com/library/test/success.html
proxy-test-url = http://www.gstatic.com/generate_204

geoip-maxmind-url = https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb

dns-server = system, 223.5.5.5, 119.29.29.29, 114.114.114.114, 1.1.1.1, 8.8.8.8
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

skip-proxy = 127.0.0.1, localhost, *.local, captive.apple.com
exclude-simple-hostnames = true

allow-wifi-access = false
http-api = 127.0.0.1:6171
http-api-tls = false

udp-policy-not-supported-behaviour = REJECT


[Proxy]
# Example 1: Trojan Return Node
# Please replace server, password, sni and other information
Return to China Node - Shanghai = trojan, cn-shanghai.example.com, 443, password=Your password, sni=cn-shanghai.example.com, skip-cert-verify=true, udp-relay=true, tfo=true

# Example 2: Shadowsocks Return Node
# If you don't need it, you can delete it.
Return to China node-Guangzhou = ss, cn-guangzhou.example.com, 8388, encrypt-method=aes-128-gcm, password=your password, udp-relay=true, tfo=true

# Example 3: VMess Return Node

# If you don't need it, you can delete it.

Return to China node-Beijing = vmess, cn-beijing.example.com, 443, username=your UUID, ws=true, ws-path=/path, tls=true, sni =cn-beijing.example.com, skip-cert-verify=true, udp-relay=true

[Proxy Group]
Return mode = select, automatically return to China, return to China node - Shanghai, return to China node - Guangzhou, return to China node - Beijing, DIRECT

Automatic return to China = url-test, return node-Shanghai, return node-Guangzhou, return node-Beijing, url=http://www.baidu.com, interval=300, tolerance=80, timeout=5

Chinese media = select, return to China mode, automatic return to China, DIRECT

Chinese application = select, return to China mode, automatic return to China, DIRECT

Chinese game = select, return to China mode, return to China automatically, DIRECT

China Finance = select, return mode, automatic return to China, DIRECT

Apple Service = select, DIRECT, return mode

Global direct connection = select, DIRECT, return mode

Ad blocking = select, REJECT, DIRECT


